    bindsym plus         mark "+", mode "default"

    bindsym bracketleft  mark "[", mode "default"
    bindsym braceleft    mark "{", mode "default"
    bindsym bracketright mark "]", mode "default"
    bindsym braceright   mark "}", mode "default"

    bindsym backslash    mark "\\", mode "default"
    bindsym bar          mark "|", mode "default"

    bindsym semicolon    mark ";", mode "default"
    bindsym colon        mark ":", mode "default"

    bindsym apostrophe   mark "'", mode "default"
    bindsym quotedbl     mark "\"", mode "default"

    bindsym comma        mark ",", mode "default"
    bindsym less         mark "<", mode "default"
    bindsym period       mark ".", mode "default"
    bindsym greater      mark ">", mode "default"

    bindsym slash        mark "/", mode "default"
    bindsym question     mark "?", mode "default"

    bindsym grave        mark "`", mode "default"
    bindsym asciitilde   mark "~", mode "default"

    bindsym Escape mode "default"
    bindsym Return mode "default"
}

