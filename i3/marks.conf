    bindsym exclam       mark "!", mode "default"
    bindsym at           mark "@", mode "default"
    bindsym numbersign   mark "#", mode "default"
    bindsym dollar       mark "$", mode "default"
    bindsym percent      mark "%", mode "default"
    bindsym asciicircum  mark "^", mode "default"
    bindsym ampersand    mark "&", mode "default"
